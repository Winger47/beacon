[project]
name = "kata-core-api"
version = "0.0.0"
description = "Kata core-api: domain CRUD, RBAC, triage workflows, queries. Owns the `core` schema."
requires-python = ">=3.12"
dependencies = [
    "kata-domain",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kata_core_api"]

[tool.uv.sources]
kata-domain = { workspace = true }
