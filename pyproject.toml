# Kata Python workspace root.
# This is NOT an installable package; it holds the uv workspace definition and the
# shared tooling config (ruff, mypy --strict, pytest) inherited by all members.
[project]
name = "kata-workspace"
version = "0.0.0"
description = "Kata monorepo Python workspace root (tooling + workspace config only)."
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "jsonschema>=4.22",        # validate the Kata Generic v1 contract in tests
    "python-multipart>=0.0.9", # core-api import endpoint (multipart upload)
    "hypothesis>=6.100",       # property tests for hash normalization (ADR-0011)
    # Workspace members, installed editable so `uv run pytest` can import them.
    "kata-domain",
    "kata-parsers",
    "kata-core-api",
]

[tool.uv.workspace]
members = ["packages/kata-domain", "packages/kata-parsers", "services/core-api"]

[tool.uv.sources]
kata-domain = { workspace = true }
kata-parsers = { workspace = true }
kata-core-api = { workspace = true }

# ---------------------------------------------------------------------------
# ruff: lint + format, shared across the whole workspace
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "services/*/src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "TID",           # tidy imports
    "RUF",           # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["kata_domain", "kata_parsers", "kata_core_api"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Form", "fastapi.File",
]

# ---------------------------------------------------------------------------
# mypy: strict everywhere
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = ["packages/kata-domain/src", "packages/kata-parsers/src", "services/core-api/src"]

# ijson ships no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "packages/kata-domain/tests",
    "packages/kata-parsers/tests",
    "services/core-api/tests",
    "scripts/parity/tests",
]
# src-layout packages: put their src dirs on sys.path for tests, independent of
# editable-install mechanics. Services get proper installs later. "." lets the parity
# harness import as ``scripts.parity.*``.
pythonpath = [
    "packages/kata-domain/src",
    "packages/kata-parsers/src",
    "services/core-api/src",
    ".",
]
