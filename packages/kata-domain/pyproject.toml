[project]
name = "kata-domain"
version = "0.0.0"
description = "Kata domain model, repositories, transition(), dedup and reimport logic."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kata_domain"]
