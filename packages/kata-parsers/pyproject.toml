[project]
name = "kata-parsers"
version = "0.0.0"
description = "Kata parser SDK: streaming scanner parsers mapping raw reports to canonical findings."
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.3",       # streaming JSON (BSD)
    "defusedxml>=0.7.1", # safe streaming XML (PSF)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kata_parsers"]
# Ship the Generic v1 JSON Schema as package data (loaded via importlib.resources).
artifacts = ["src/kata_parsers/schemas/*.json"]
