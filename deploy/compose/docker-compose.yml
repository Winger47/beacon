# Kata local stack. Profiles: core | ingest | observability | full.
#   make up                 -> core    (Postgres, Valkey, Keycloak, Caddy edge)
#   make up PROFILE=ingest  -> Kafka (KRaft) + SeaweedFS
#   make up PROFILE=observability -> OTel Collector + Prometheus + Grafana + Loki + Tempo
#   make up PROFILE=full    -> everything
#
# Every service lists its own profile AND "full", so --profile full starts them all.
name: kata

x-restart: &restart
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ core
  postgres:
    image: postgres:16
    <<: *restart
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kata}
      POSTGRES_DB: ${POSTGRES_DB:-kata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kata} -d ${POSTGRES_DB:-kata}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.0
    <<: *restart
    profiles: ["core", "full"]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    <<: *restart
    profiles: ["core", "full"]
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    # Phase 1 commits a realm export and mounts it at /opt/keycloak/data/import.

  edge:
    image: caddy:2
    <<: *restart
    profiles: ["core", "full"]
    ports:
      - "${EDGE_HTTP_PORT:-8000}:8000"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - keycloak

  # ---------------------------------------------------------------- ingest
  kafka:
    image: apache/kafka:3.8.0
    <<: *restart
    profiles: ["ingest", "full"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.73
    <<: *restart
    profiles: ["ingest", "full"]
    command: "server -s3 -dir=/data"
    ports:
      - "${SEAWEED_S3_PORT:-8333}:8333" # S3 API
      - "${SEAWEED_UI_PORT:-9333}:9333" # master UI
    volumes:
      - seaweeddata:/data

  # --------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    <<: *restart
    profiles: ["observability", "full"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.55.0
    <<: *restart
    profiles: ["observability", "full"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: grafana/loki:3.2.0
    <<: *restart
    profiles: ["observability", "full"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "${LOKI_PORT:-3100}:3100"

  tempo:
    image: grafana/tempo:2.6.0
    <<: *restart
    profiles: ["observability", "full"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./config/tempo/config.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  grafana:
    image: grafana/grafana:11.3.0
    <<: *restart
    profiles: ["observability", "full"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  seaweeddata:
